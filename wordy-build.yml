name: Build WORDY APK (Auto ZIP + Capacitor)

'on':
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build WORDY APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect and extract uploaded ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y unzip
          fi

          CHANGED_ZIP="$(git diff-tree --root --no-commit-id --name-only -r HEAD | grep -iE '\.zip$' | head -n 1 || true)"
          if [[ -n "$CHANGED_ZIP" && -f "$CHANGED_ZIP" ]]; then
            ZIP_FILE="$CHANGED_ZIP"
          else
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' ! -path './.git/*' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2- || true)"
          fi

          if [[ -n "${ZIP_FILE:-}" ]]; then
            echo "ZIP found: $ZIP_FILE"
            unzip -tq "$ZIP_FILE"
            rm -rf _unzipped_src
            mkdir -p _unzipped_src
            unzip -q -o "$ZIP_FILE" -d _unzipped_src

            PKG_PATH="$(find _unzipped_src -maxdepth 5 -type f -name package.json ! -path '*/node_modules/*' | head -n 1 || true)"
            if [[ -z "$PKG_PATH" ]]; then
              echo "::error::No package.json found inside the ZIP."
              exit 1
            fi
            SRC_DIR="$(dirname "$PKG_PATH")"
            echo "Source project: $SRC_DIR"
            echo "workdir=$SRC_DIR" >> "$GITHUB_OUTPUT"
          elif [[ -f package.json ]]; then
            echo "workdir=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::No source ZIP or root package.json found."
            exit 1
          fi
          echo "has_source=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 24
        if: steps.source.outputs.has_source == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Setup Java 21
        if: steps.source.outputs.has_source == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        if: steps.source.outputs.has_source == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies and build web app
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.workdir }}"

          if [[ -f package-lock.json ]]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

          # recharts needs react-is; match its major version to the installed React.
          REACT_MAJOR="$(node -p "require('./node_modules/react/package.json').version.split('.')[0]")"
          npm install --no-save --legacy-peer-deps --no-audit --no-fund "react-is@^${REACT_MAJOR}.0.0"

          npm run build

      - name: Sync Capacitor Android
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.workdir }}"

          if [[ ! -f capacitor.config.ts && ! -f capacitor.config.js && ! -f capacitor.config.json ]]; then
            echo "::error::Capacitor config not found."
            exit 1
          fi

          if [[ ! -d android ]]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Accept Android SDK licenses
        if: steps.source.outputs.has_source == 'true'
        run: |
          if [[ -n "${ANDROID_HOME:-}" && -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Prepare release keystore
        if: steps.source.outputs.has_source == 'true'
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/wordy-release.jks"
            echo "has_release_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release keystore secret; building debug APK."
          fi

      - name: Build signed release WORDY APK
        if: steps.source.outputs.has_source == 'true' && steps.keystore.outputs.has_release_key == 'true'
        shell: bash
        env:
          WORDY_KEYSTORE_PATH: ${{ github.workspace }}/wordy-release.jks
          WORDY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WORDY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WORDY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WORDY_VERSION_CODE: ${{ github.run_number }}
          WORDY_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.workdir }}/android"
          chmod +x gradlew
          ./gradlew assembleRelease
          mkdir -p "${{ github.workspace }}/apk-output"
          cp app/build/outputs/apk/release/app-release.apk "${{ github.workspace }}/apk-output/WORDY.apk"

      - name: Build debug WORDY APK
        if: steps.source.outputs.has_source == 'true' && steps.keystore.outputs.has_release_key != 'true'
        shell: bash
        env:
          WORDY_VERSION_CODE: ${{ github.run_number }}
          WORDY_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.workdir }}/android"
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p "${{ github.workspace }}/apk-output"
          cp app/build/outputs/apk/debug/app-debug.apk "${{ github.workspace }}/apk-output/WORDY.apk"

      - name: Upload WORDY APK artifact
        if: steps.source.outputs.has_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WORDY-APK
          path: apk-output/WORDY.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish WORDY APK GitHub Release
        if: steps.source.outputs.has_source == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wordy-v1.0.${{ github.run_number }}
          name: WORDY v1.0.${{ github.run_number }}
          body: |
            WORDY Android APK build.
            Build type: ${{ steps.keystore.outputs.has_release_key == 'true' && 'Signed release' || 'Debug' }}
          files: apk-output/WORDY.apk
          prerelease: ${{ steps.keystore.outputs.has_release_key != 'true' }}
