name: Build WORDY.apk (Auto ZIP + Capacitor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build WORDY.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect and extract uploaded ZIP (if present)
        id: source
        run: |
          if ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y unzip
          fi

          # Oxirgi commitda yuklangan .zip faylini yoki eng yangi .zip faylini topish
          CHANGED_ZIP=$(git diff-tree --root --no-commit-id --name-only -r HEAD 2>/dev/null | grep -iE '\.zip$' | head -n 1 || true)
          if [ -n "$CHANGED_ZIP" ] && [ -f "$CHANGED_ZIP" ]; then
            ZIP_FILE="$CHANGED_ZIP"
          else
            ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" ! -path "./.git/*" -printf "%T@ %p\n" 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2- || true)
          fi

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP topildi: $ZIP_FILE — avtomatik ochilmoqda..."
            rm -rf _unzipped_src
            mkdir -p _unzipped_src
            unzip -q -o "$ZIP_FILE" -d _unzipped_src

            PKG_PATH=$(find _unzipped_src -maxdepth 3 -name "package.json" ! -path "*/node_modules/*" | head -n 1 || true)
            if [ -z "$PKG_PATH" ]; then
              echo "::error::ZIP ichida package.json topilmadi!"
              exit 1
            fi
            SRC_DIR=$(dirname "$PKG_PATH")
            echo "Topilgan loyiha papkasi: $SRC_DIR"
            echo "workdir=$SRC_DIR" >> "$GITHUB_OUTPUT"
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ]; then
            echo "ZIP topilmadi — to'g'ridan-to'g'ri joriy papkadan yig'ilmoqda."
            echo "workdir=." >> "$GITHUB_OUTPUT"
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Hali .zip yuklanmagan. Repository bosh sahifasiga .zip faylni yuklang."
            echo "has_source=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 20
        if: steps.source.outputs.has_source == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        if: steps.source.outputs.has_source == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        if: steps.source.outputs.has_source == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        if: steps.source.outputs.has_source == 'true'
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Install dependencies & sync Capacitor Android
        if: steps.source.outputs.has_source == 'true'
        run: |
          cd "${{ steps.source.outputs.workdir }}"
          npm install --legacy-peer-deps        
npm install --no-save --legacy-peer-deps react-is
npm run build        
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Release Keystore (persistent signature)
        if: steps.source.outputs.has_source == 'true'
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/wordy-release.jks"
            echo "has_release_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 topilmadi. Debug imzo bilan WORDY.apk yig'ilmoqda."
          fi

      - name: Build Signed Release WORDY.apk
        if: steps.source.outputs.has_source == 'true' && steps.keystore.outputs.has_release_key == 'true'
        env:
          WORDY_KEYSTORE_PATH: ${{ github.workspace }}/wordy-release.jks
          WORDY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WORDY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WORDY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WORDY_VERSION_CODE: ${{ github.run_number }}
          WORDY_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd "${{ steps.source.outputs.workdir }}/android"
          chmod +x gradlew
          ./gradlew assembleRelease
          mkdir -p "${{ github.workspace }}/apk-output"
          cp app/build/outputs/apk/release/app-release.apk "${{ github.workspace }}/apk-output/WORDY.apk"

      - name: Build Fallback Debug WORDY.apk
        if: steps.source.outputs.has_source == 'true' && steps.keystore.outputs.has_release_key != 'true'
        env:
          WORDY_VERSION_CODE: ${{ github.run_number }}
          WORDY_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd "${{ steps.source.outputs.workdir }}/android"
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p "${{ github.workspace }}/apk-output"
          cp app/build/outputs/apk/debug/app-debug.apk "${{ github.workspace }}/apk-output/WORDY.apk"

      - name: Upload WORDY.apk artifact
        if: steps.source.outputs.has_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WORDY.apk
          path: apk-output/WORDY.apk
          retention-days: 30

      - name: Publish direct WORDY.apk GitHub Release
        if: steps.source.outputs.has_source == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wordy-v1.0.${{ github.run_number }}
          name: WORDY v1.0.${{ github.run_number }}
          body: |
            WORDY (com.wordy.uzgame) — tayyor Android APK fayli.
            Imzo turi: ${{ steps.keystore.outputs.has_release_key == 'true' && 'Release Keystore (doimiy imzo)' || 'Debug imzo' }}
          files: apk-output/WORDY.apk
          prerelease: ${{ steps.keystore.outputs.has_release_key != 'true' }}
